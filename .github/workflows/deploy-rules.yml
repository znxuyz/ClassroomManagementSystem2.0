# 自動發布 Firestore 安全性規則
# ──────────────────────────────────────────────
# firestore.rules 一推上 main 就自動發布,不必再記得去後台貼一次。
# 規則有語法錯誤或權限不足時,這個流程會失敗並寄信通知 —— 失敗就是
# 「沒有發布」,線上跑的還是舊的那一份,不會把壞規則推上去。
#
# 需要先設定一次:見 docs/自動發布規則.md

name: 發布 Firestore 規則

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-rules.yml'
  workflow_dispatch:        # 也可以在 Actions 頁面手動按一次

# 同時間只跑一個,避免兩次推送互相覆蓋
concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安裝 firebase-tools
        run: npm install -g firebase-tools@15

      # firebase deploy 發布前會先問 Google「Firestore API 開了沒」,
      # 那一步要 serviceusage 權限,跟「改規則」本身無關。
      # 但它會先查本機快取,命中就完全不連網 —— 這個專案的 Firestore
      # 本來就開著(網站天天在用),所以直接把答案填進快取,
      # 省掉那個權限,服務帳戶就只需要「改規則」這一個角色。
      - name: 跳過 API 啟用檢查
        run: |
          PROJECT=$(jq -r '.projects.default' .firebaserc)
          mkdir -p "$HOME/.config/configstore"
          printf '{"apiEnablementCache":{"%s":{"firestore.googleapis.com":true}}}' \
            "$PROJECT" > "$HOME/.config/configstore/firebase-tools.json"
          chmod 600 "$HOME/.config/configstore/firebase-tools.json"

      - name: 寫出服務帳戶金鑰
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::找不到 FIREBASE_SERVICE_ACCOUNT。請依 docs/自動發布規則.md 設定一次。"
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: 發布規則
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set +e
          out=$(firebase deploy --only firestore:rules --non-interactive 2>&1)
          code=$?
          echo "$out"
          # 權限不足的訊息很長,直接把該補哪個角色講清楚
          if [ $code -ne 0 ] && echo "$out" | grep -q 'serviceusage'; then
            echo "::error::上一步的「跳過 API 啟用檢查」沒生效。請確認 .firebaserc 裡的專案代號與實際專案一致。"
          elif [ $code -ne 0 ] && echo "$out" | grep -qi 'permission\|403'; then
            echo "::error::服務帳戶少了「Firebase Rules 管理員」角色,見 docs/自動發布規則.md 第 1 步。金鑰不用重做。"
          fi
          exit $code

      - name: 清掉金鑰
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
